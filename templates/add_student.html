<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Student Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            z-index: 0;
        }

        body::before {
            top: -200px;
            left: -200px;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            bottom: -200px;
            right: -200px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(30px) rotate(10deg); }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideIn 0.6s ease-out;
        }

        header h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        .form-box {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 24px;
        }

        form {
            display: grid;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.15s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }
        .form-group:nth-child(4) { animation-delay: 0.25s; }
        .form-group:nth-child(5) { animation-delay: 0.3s; }
        .form-group:nth-child(6) { animation-delay: 0.35s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        label {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: #f8f9ff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        button {
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:active {
            transform: translateY(-1px);
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            color: white;
            margin-top: 30px;
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-box h3 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid rgba(255, 255, 255, 0.5);
        }

        .result-item h4 {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .probability {
            font-size: 24px;
            font-weight: 700;
        }

        .risk-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href='/dashboard' class="back-link">← Back to Dashboard</a>

        <header>
            <h1>📝 Add Student Information</h1>
            <p>Enter student data to get performance prediction</p>
        </header>

        <div class="form-box">
            <h2>Student Data Form</h2>
            <form method='post'>
                <div class="form-group">
                    <label for="email">👤 Parent Email</label>
                    <input type='email' id='email' name='parent_email' placeholder='parent@example.com' required>
                </div>

                <div class="form-group">
                    <label for="attendance">📅 Attendance (%)</label>
                    <input type='number' id='attendance' name='attendance' placeholder='e.g., 85' min='0' max='100' step='0.1' required>
                </div>

                <div class="form-group">
                    <label for="assignment">📋 Assignment Marks</label>
                    <input type='number' id='assignment' name='assignment' placeholder='e.g., 90' min='0' max='100' step='0.1' required>
                </div>

                <div class="form-group">
                    <label for="study">⏰ Study Hours (per week)</label>
                    <input type='number' id='study' name='study_hours' placeholder='e.g., 25' min='0' max='200' step='0.5' required>
                </div>

                <div class="form-group">
                    <label for="marks">🎓 Mid-term Marks</label>
                    <input type='number' id='marks' name='mid_marks' placeholder='e.g., 85' min='0' max='100' step='0.1' required>
                </div>

                <button type='submit'>🚀 Get Prediction</button>
            </form>

            {% if result %}
            <div class="result-box">
                <h3>✨ Prediction Results</h3>
                
                <div class="result-item">
                    <h4>Prediction Status</h4>
                    <p>{{ result }}</p>
                </div>

                <div class="result-item">
                    <h4>Probability of Passing</h4>
                    <p class="probability">{{ probability }}%</p>
                </div>

                <div class="result-item">
                    <h4>Risk Classification</h4>
                    <span class="risk-badge">{{ risk }}</span>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
